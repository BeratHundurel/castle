# Keep development MCP access scoped to this trusted project.
# The database lives under target/ and is intentionally separate from user data.
mcp_optional_startup_grace_ms = 15000

[mcp_servers.castle]
command = "pwsh"
args = [
    "-NoProfile",
    "-File",
    "scripts/launch-mcp.ps1",
    "-Database",
    "target/agent-data/castle.db",
]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 600
tool_timeout_sec = 120
default_tools_approval_mode = "writes"
