[package]
name         = "app"
version.workspace = true
publish      = false
edition.workspace = true

[[bin]]
name = "castle"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
reqwest_client.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
image.workspace = true
chrono.workspace = true
storage = { path = "../storage" }
runtime = { path = "../runtime" }
settings = { path = "../settings" }
shell = { path = "../shell" }
board = { path = "../board" }
command_palette = { path = "../command_palette" }
quick_capture = { path = "../quick_capture" }
document_editor = { path = "../document_editor" }
dotenvy = "0.15"
global-hotkey = "0.8.0"
raw-window-handle = "0.6.2"
tray-icon = "0.24.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62.2", features = ["UI_Notifications"] }
tauri-winrt-notification = "0.8.1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
storage = { path = "../storage", features = ["test-support"] }
tempfile = "3.23"
sea-orm.workspace = true
migration = { path = "../migration" }
entity = { path = "../entity" }

[build-dependencies]
embed-resource = "3.0"
